name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        shell: bash
        run: |
          set -uo pipefail
          # Run tsc but don't let its non-zero exit abort the step yet; we decide
          # pass/fail from the filtered error lines below.
          output="$(npx tsc --noEmit --pretty false --project tsconfig.json 2>&1)" || true
          # Keep only real error lines that are NOT in the Deno edge functions.
          errors="$(printf '%s\n' "$output" | grep 'error TS' | grep -v 'supabase/functions/')" || true
          if [ -n "$errors" ]; then
            echo "Type errors found (excluding supabase/functions/):"
            printf '%s\n' "$errors"
            exit 1
          fi
          echo "Type check passed (supabase/functions/ excluded)."

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:5173
