<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassroomBoard — Wrap-up · Wheel of Destiny (Reveal)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: { fontFamily: {
  display: ['Fredoka','sans-serif'], body: ['Inter','sans-serif'], cn: ['Noto Sans SC','sans-serif']
}}}};
</script>
<style>
/* Only for effects Tailwind can't do: conic gradients, keyframe animations */
@keyframes nodePulse { 0%,100%{box-shadow:0 0 20px rgba(168,85,247,.35),0 0 40px rgba(168,85,247,.35);transform:scale(1)} 50%{box-shadow:0 0 28px rgba(168,85,247,.35),0 0 56px rgba(168,85,247,.35);transform:scale(1.06)} }
@keyframes scorePop { 0%{opacity:.9;transform:translateY(0)} 100%{opacity:0;transform:translateY(-25px)} }
@keyframes bannerGlow { 0%,100%{box-shadow:0 0 20px rgba(239,68,68,.15),0 0 40px rgba(239,68,68,.06)} 50%{box-shadow:0 0 30px rgba(239,68,68,.25),0 0 60px rgba(239,68,68,.12)} }
@keyframes spotlightSweep { from{transform:rotate(0)} to{transform:rotate(360deg)} }
@keyframes avatarPulse { 0%,100%{box-shadow:0 0 16px rgba(239,68,68,.4)} 50%{box-shadow:0 0 24px rgba(239,68,68,.6),0 0 48px rgba(239,68,68,.2)} }
@keyframes fadeInUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
@keyframes wheelSpin { from{transform:rotate(0)} to{transform:rotate(1800deg)} }
@keyframes wheelIdle { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
@keyframes glowPulse { 0%,100%{opacity:.4} 50%{opacity:.8} }
@keyframes nameZoom { 0%{opacity:0;transform:scale(.2)} 60%{opacity:1;transform:scale(1.15)} 100%{opacity:1;transform:scale(1)} }
@keyframes avatarZoom { 0%{opacity:0;transform:scale(0) rotate(-180deg)} 60%{opacity:1;transform:scale(1.1) rotate(10deg)} 100%{opacity:1;transform:scale(1) rotate(0)} }
@keyframes nameGlow { 0%,100%{text-shadow:0 0 20px rgba(216,180,254,.5),0 0 40px rgba(168,85,247,.3)} 50%{text-shadow:0 0 30px rgba(216,180,254,.8),0 0 60px rgba(168,85,247,.5)} }
@keyframes particleFloat { 0%{opacity:0;transform:translateY(0) translateX(0) scale(.5)} 15%{opacity:1} 100%{opacity:0;transform:translateY(-300px) translateX(var(--dx,0px)) scale(1.2)} }
@keyframes burstExpand { 0%{opacity:0;transform:scale(0)} 40%{opacity:1} 100%{opacity:0;transform:scale(3)} }
@keyframes winnerRing { 0%,100%{box-shadow:0 0 30px rgba(239,68,68,.5),0 0 60px rgba(239,68,68,.3);transform:scale(1)} 50%{box-shadow:0 0 50px rgba(239,68,68,.8),0 0 90px rgba(239,68,68,.4);transform:scale(1.04)} }
.anim-node-pulse{animation:nodePulse 2s ease-in-out infinite}
.anim-score-pop{animation:scorePop 2.5s ease-out infinite}
.anim-banner-glow{animation:bannerGlow 2.5s ease-in-out infinite}
.anim-spotlight{animation:spotlightSweep 5s linear infinite}
.anim-avatar-pulse{animation:avatarPulse 3s ease-in-out infinite}
.anim-glow-pulse{animation:glowPulse 2.4s ease-in-out infinite}
.anim-name-zoom{animation:nameZoom .9s cubic-bezier(.34,1.56,.64,1) both}
.anim-avatar-zoom{animation:avatarZoom 1s cubic-bezier(.34,1.56,.64,1) both}
.anim-name-glow{animation:nameGlow 2s ease-in-out infinite}
.anim-burst{animation:burstExpand 2.5s ease-out infinite}
.anim-winner-ring{animation:winnerRing 1.8s ease-in-out infinite}
.particle-float{animation:particleFloat 3s ease-in infinite}
</style>
</head>
<!-- ANIM: scale 1920×1080 canvas to fit any viewport via JS transform -->
<body class="w-[1920px] h-[1080px] overflow-hidden bg-gradient-to-br from-slate-900 to-slate-950 font-body text-slate-50 select-none">

<!-- ═══════════════════════════════════════════════════ -->
<!-- SHELL: header — Phase Arc Rail (shared across all screens) -->
<!-- ═══════════════════════════════════════════════════ -->
<header class="absolute top-0 left-0 right-0 h-20 flex items-center justify-center px-24 z-10">
  <div class="flex items-center">
    <div class="flex flex-col items-center z-10 shrink-0">
      <div class="w-[22px] h-[22px] rounded-full border-[2.5px] border-amber-400 bg-amber-400 opacity-70 flex items-center justify-center mb-1.5">
        <span class="text-slate-900 font-bold text-[11px]">✓</span>
      </div>
      <span class="font-display text-[13px] font-semibold text-slate-300/65">Warm-up</span>
      <span class="font-cn text-[10px] text-slate-400/40">热身</span>
    </div>
    <div class="w-[70px] h-[3px] bg-amber-400 opacity-55 rounded-full self-start mt-[30px]"></div>

    <div class="flex flex-col items-center z-10 shrink-0">
      <div class="w-[22px] h-[22px] rounded-full border-[2.5px] border-amber-400 bg-amber-400 opacity-70 flex items-center justify-center mb-1.5">
        <span class="text-slate-900 font-bold text-[11px]">✓</span>
      </div>
      <span class="font-display text-[13px] font-semibold text-slate-300/65">Input</span>
      <span class="font-cn text-[10px] text-slate-400/40">输入</span>
    </div>
    <div class="w-[70px] h-[3px] bg-amber-400 opacity-55 rounded-full self-start mt-[30px]"></div>

    <div class="flex flex-col items-center z-10 shrink-0">
      <div class="w-[22px] h-[22px] rounded-full border-[2.5px] border-amber-400 bg-amber-400 opacity-70 flex items-center justify-center mb-1.5">
        <span class="text-slate-900 font-bold text-[11px]">✓</span>
      </div>
      <span class="font-display text-[13px] font-semibold text-slate-300/65">Practice</span>
      <span class="font-cn text-[10px] text-slate-400/40">练习</span>
    </div>
    <div class="w-[70px] h-[3px] bg-amber-400 opacity-55 rounded-full self-start mt-[30px]"></div>

    <div class="flex flex-col items-center z-10 shrink-0">
      <div class="w-[22px] h-[22px] rounded-full border-[2.5px] border-amber-400 bg-amber-400 opacity-70 flex items-center justify-center mb-1.5">
        <span class="text-slate-900 font-bold text-[11px]">✓</span>
      </div>
      <span class="font-display text-[13px] font-semibold text-slate-300/65">Assess</span>
      <span class="font-cn text-[10px] text-slate-400/40">评估</span>
    </div>
    <div class="w-[70px] h-[3px] bg-amber-400 opacity-55 rounded-full self-start mt-[30px]"></div>

    <div class="flex flex-col items-center z-10 shrink-0">
      <div class="w-[22px] h-[22px] rounded-full border-[2.5px] border-amber-400 bg-amber-400 opacity-70 flex items-center justify-center mb-1.5">
        <span class="text-slate-900 font-bold text-[11px]">✓</span>
      </div>
      <span class="font-display text-[13px] font-semibold text-slate-300/65">Produce</span>
      <span class="font-cn text-[10px] text-slate-400/40">产出</span>
    </div>
    <div class="w-[70px] h-[3px] bg-gradient-to-r from-amber-400 to-purple-500 rounded-full self-start mt-[30px] shadow-[0_0_10px_rgba(168,85,247,.35)]"></div>

    <!-- DISPLAY: active phase node — WRAP (purple) -->
    <div class="flex flex-col items-center z-10 shrink-0">
      <div class="w-[34px] h-[34px] rounded-full bg-purple-500 border-purple-400 border-2 anim-node-pulse flex items-center justify-center mb-1.5 text-sm">🎡</div>
      <span class="font-display text-[17px] font-semibold text-purple-400">Wrap</span>
      <span class="font-cn text-[12px] text-slate-300/65">总结</span>
    </div>
  </div>
  <div class="absolute top-4 right-8 font-body text-[15px] text-slate-400/40 tabular-nums" id="clock">14:32</div>
</header>

<!-- ═══════════════════════════════════════════════════ -->
<!-- MAIN BOARD — 3-column grid -->
<!-- ═══════════════════════════════════════════════════ -->
<main class="absolute top-20 left-0 right-0 bottom-0 grid grid-cols-[260px_1fr_240px] gap-4 px-6 pb-[108px] pt-4">

  <!-- ═══════════════════════════════════════ -->
  <!-- SHELL: team-scores (left rail) -->
  <!-- ═══════════════════════════════════════ -->
  <aside class="flex flex-col gap-4 pt-3">
    <div class="relative overflow-hidden rounded-[20px] border border-red-500/25 bg-white/[.06] p-5 backdrop-blur-sm">
      <div class="absolute inset-0" style="background:radial-gradient(ellipse at 20% 20%,rgba(239,68,68,.3),transparent 70%)"></div>
      <div class="relative flex items-center gap-2.5 mb-2">
        <div class="w-4 h-4 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,.3)]"></div>
        <span class="font-display text-[17px] font-semibold">Team Red</span>
      </div>
      <div class="relative font-display text-[56px] font-bold tabular-nums leading-none text-red-300">450</div>
      <div class="absolute top-4 right-5 font-display text-[22px] font-bold text-amber-400 anim-score-pop">+12</div>
    </div>
    <div class="relative overflow-hidden rounded-[20px] border border-blue-500/25 bg-white/[.06] p-5 backdrop-blur-sm">
      <div class="absolute inset-0" style="background:radial-gradient(ellipse at 20% 20%,rgba(59,130,246,.3),transparent 70%)"></div>
      <div class="relative flex items-center gap-2.5 mb-2">
        <div class="w-4 h-4 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,.3)]"></div>
        <span class="font-display text-[17px] font-semibold">Team Blue</span>
      </div>
      <div class="relative font-display text-[56px] font-bold tabular-nums leading-none text-blue-300">380</div>
    </div>
    <div class="bg-white/[.06] border border-white/8 rounded-2xl px-[18px] py-4 text-center mt-auto">
      <div class="text-[11px] text-slate-400/40 uppercase tracking-widest mb-1.5">Round</div>
      <div class="font-display text-[28px] font-bold text-amber-400">3 / 5</div>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════ -->
  <!-- CONTENT: Wheel of Destiny — REVEAL (WRAPUP, PURPLE accent) -->
  <!-- ═══════════════════════════════════════ -->
  <section class="relative overflow-hidden rounded-[28px] border-2 border-purple-500 bg-white/[.06] flex items-center justify-center p-8 shadow-[0_0_30px_rgba(168,85,247,.35),inset_0_0_60px_rgba(168,85,247,.05)]">
    <!-- DISPLAY: phase badge -->
    <div class="absolute top-5 left-6 flex items-center gap-2 bg-purple-500/12 border border-purple-500/25 rounded-full px-4 py-1.5 z-10">
      <div class="w-2.5 h-2.5 rounded-full bg-purple-500 shadow-[0_0_8px_rgba(168,85,247,.35)]"></div>
      <span class="font-display text-sm font-semibold text-purple-400 uppercase tracking-wider">Wrap-up — Wheel of Destiny</span>
    </div>

    <!-- ══ Radial burst behind center ══ -->
    <!-- ANIM: radial gold/purple light emanating outward -->
    <div class="absolute pointer-events-none anim-burst" style="top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.35) 0%,rgba(168,85,247,.25) 35%,transparent 70%)"></div>
    <div class="absolute pointer-events-none anim-glow-pulse" style="top:50%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(216,180,254,.25),transparent 60%)"></div>

    <!-- Floating celebration particles (gold + purple) -->
    <!-- ANIM: particles drift upward -->
    <div class="absolute particle-float" style="--dx:-30px;left:25%;bottom:25%;width:14px;height:14px;border-radius:50%;background:#FBBF24;box-shadow:0 0 12px rgba(251,191,36,.8);animation-delay:0s"></div>
    <div class="absolute particle-float" style="--dx:40px;left:35%;bottom:30%;width:10px;height:10px;border-radius:50%;background:#A855F7;box-shadow:0 0 10px rgba(168,85,247,.8);animation-delay:.4s"></div>
    <div class="absolute particle-float" style="--dx:-15px;left:50%;bottom:28%;width:12px;height:12px;border-radius:50%;background:#FBBF24;box-shadow:0 0 12px rgba(251,191,36,.8);animation-delay:.8s"></div>
    <div class="absolute particle-float" style="--dx:50px;left:65%;bottom:32%;width:8px;height:8px;border-radius:50%;background:#D8B4FE;box-shadow:0 0 10px rgba(216,180,254,.9);animation-delay:.2s"></div>
    <div class="absolute particle-float" style="--dx:-40px;left:75%;bottom:25%;width:14px;height:14px;border-radius:50%;background:#FBBF24;box-shadow:0 0 14px rgba(251,191,36,.8);animation-delay:1.1s"></div>
    <div class="absolute particle-float" style="--dx:20px;left:30%;bottom:45%;width:8px;height:8px;border-radius:50%;background:#A855F7;box-shadow:0 0 10px rgba(168,85,247,.8);animation-delay:1.5s"></div>
    <div class="absolute particle-float" style="--dx:-25px;left:70%;bottom:48%;width:10px;height:10px;border-radius:50%;background:#FBBF24;box-shadow:0 0 12px rgba(251,191,36,.8);animation-delay:.6s"></div>
    <div class="absolute particle-float" style="--dx:35px;left:45%;bottom:50%;width:6px;height:6px;border-radius:50%;background:#D8B4FE;box-shadow:0 0 8px rgba(216,180,254,.9);animation-delay:1.8s"></div>

    <!-- ══ Wheel (stopped, Leo's segment at top under pointer) ══ -->
    <!-- DYNAMIC: wheel rotated to land Leo's segment at top (22.5° center - already at top, offset slightly) -->
    <div class="absolute z-0" style="left:60px;top:50%;transform:translateY(-50%);filter:drop-shadow(0 0 30px rgba(168,85,247,.3)) opacity(.55)">
      <div class="relative" style="width:340px;height:340px;opacity:.55">
        <div class="w-full h-full rounded-full" style="background:conic-gradient(
          #8B5CF6 0deg 45deg,
          #D946EF 45deg 90deg,
          #EC4899 90deg 135deg,
          #F43F5E 135deg 180deg,
          #EF4444 180deg 225deg,
          #F97316 225deg 270deg,
          #F59E0B 270deg 315deg,
          #FBBF24 315deg 360deg
        )"></div>
        <!-- Highlighted Leo segment (top, purple-500 first segment, glowing) -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 rounded-t-full anim-winner-ring" style="width:0;height:0;border-left:60px solid transparent;border-right:60px solid transparent;border-bottom:120px solid rgba(251,191,36,.25);transform-origin:bottom center;filter:blur(4px)"></div>
      </div>
      <!-- Pointer (stopped, pointing at Leo's segment) -->
      <div class="absolute -top-2 left-1/2 -translate-x-1/2 z-20" style="filter:drop-shadow(0 4px 8px rgba(168,85,247,.8))">
        <svg width="40" height="40" viewBox="0 0 56 56">
          <polygon points="28,52 4,4 52,4" fill="#FBBF24" stroke="#FFFFFF" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <!-- ══ Revealed Student Display (centered, on top) ══ -->
    <!-- DISPLAY: chosen student (Leo 🦁, Team Red accent border) -->
    <div class="relative z-10 flex flex-col items-center text-center" style="margin-left:280px">
      <!-- Large avatar with Team Red winner-ring border -->
      <!-- ANIM: avatar zooms in from scale 0 -->
      <div class="relative anim-avatar-zoom mb-6">
        <div class="w-[260px] h-[260px] rounded-full flex items-center justify-center text-[200px] leading-none anim-winner-ring border-[6px] border-red-500" style="background:radial-gradient(circle at 50% 40%,rgba(239,68,68,.2),rgba(15,23,42,.4))">
          🦁
        </div>
        <!-- Crown badge -->
        <div class="absolute -top-4 -right-2 text-5xl anim-glow-pulse">👑</div>
      </div>

      <!-- Name (zooms in) -->
      <!-- ANIM: name zooms in from scale 0 -->
      <h1 class="font-display text-8xl font-black text-purple-300 leading-none mb-3 anim-name-zoom anim-name-glow">Leo!</h1>

      <!-- "It's your turn!" -->
      <p class="font-display text-4xl text-purple-200 mb-2 anim-name-zoom" style="animation-delay:.15s">It's your turn!</p>

      <!-- Chinese -->
      <p class="font-cn text-3xl text-slate-300 anim-name-zoom" style="animation-delay:.3s">轮到你了，Leo！</p>
    </div>

  </section>

  <!-- ═══════════════════════════════════════ -->
  <!-- SHELL: leaderboard (right rail) -->
  <!-- ═══════════════════════════════════════ -->
  <aside>
    <div class="bg-white/[.06] border border-white/8 rounded-[20px] px-[18px] py-5 flex flex-col gap-1.5 backdrop-blur-sm">
      <div class="font-display text-[15px] font-semibold text-slate-300/65 mb-2 uppercase tracking-wider">🏆 Leaderboard</div>
      <div class="flex items-center gap-2.5 px-2.5 py-2 rounded-xl bg-amber-400/10">
        <span class="font-display text-base font-bold text-amber-400 w-6 text-center">1</span>
        <div class="w-[34px] h-[34px] rounded-full flex items-center justify-center text-[17px] shrink-0" style="background:linear-gradient(135deg,#F472B6,#A855F7)">🦊</div>
        <span class="font-display text-lg font-semibold flex-1">Mia</span>
        <span class="font-display text-xl font-bold text-blue-400 tabular-nums">120</span>
      </div>
      <div class="flex items-center gap-2.5 px-2.5 py-2 rounded-xl">
        <span class="font-display text-base font-bold text-amber-400 w-6 text-center">2</span>
        <div class="w-[34px] h-[34px] rounded-full flex items-center justify-center text-[17px] shrink-0" style="background:linear-gradient(135deg,#F97316,#EF4444)">🦁</div>
        <span class="font-display text-lg font-semibold flex-1">Leo</span>
        <span class="font-display text-xl font-bold text-blue-400 tabular-nums">110</span>
      </div>
      <div class="flex items-center gap-2.5 px-2.5 py-2 rounded-xl">
        <span class="font-display text-base font-bold text-amber-400 w-6 text-center">3</span>
        <div class="w-[34px] h-[34px] rounded-full flex items-center justify-center text-[17px] shrink-0" style="background:linear-gradient(135deg,#3B82F6,#6366F1)">🐯</div>
        <span class="font-display text-lg font-semibold flex-1">Tom</span>
        <span class="font-display text-xl font-bold text-blue-400 tabular-nums">95</span>
      </div>
      <div class="flex items-center gap-2.5 px-2.5 py-2 rounded-xl">
        <span class="font-display text-base font-bold text-amber-400 w-6 text-center">4</span>
        <div class="w-[34px] h-[34px] rounded-full flex items-center justify-center text-[17px] shrink-0" style="background:linear-gradient(135deg,#22C55E,#14B8A6)">🦋</div>
        <span class="font-display text-lg font-semibold flex-1">Jenny</span>
        <span class="font-display text-xl font-bold text-blue-400 tabular-nums">82</span>
      </div>
      <div class="flex items-center gap-2.5 px-2.5 py-2 rounded-xl">
        <span class="font-display text-base font-bold text-amber-400 w-6 text-center">5</span>
        <div class="w-[34px] h-[34px] rounded-full flex items-center justify-center text-[17px] shrink-0" style="background:linear-gradient(135deg,#FBBF24,#F97316)">🐻</div>
        <span class="font-display text-lg font-semibold flex-1">Ben</span>
        <span class="font-display text-xl font-bold text-blue-400 tabular-nums">74</span>
      </div>
    </div>
  </aside>
</main>

<!-- ═══════════════════════════════════════════════════ -->
<!-- SHELL: whose-turn (bottom bar) -->
<!-- ═══════════════════════════════════════════════════ -->
<footer class="absolute bottom-0 left-0 right-0 h-[100px] flex items-center justify-center px-[270px] pb-[18px] z-10">
  <div class="absolute left-[274px] flex items-center gap-2 bg-white/[.06] border border-white/8 rounded-full px-5 py-2 backdrop-blur-sm">
    <span class="text-xl">🙋</span>
    <span class="font-display text-lg font-bold tracking-wide">INDIVIDUAL</span>
  </div>
  <div class="relative flex items-center gap-[18px] bg-white/10 border-2 border-white/15 rounded-full p-[10px] pr-11 pl-4 backdrop-blur-md anim-banner-glow">
    <div class="absolute inset-[-3px] rounded-full anim-spotlight" style="background:conic-gradient(from 0deg,transparent 0%,rgba(239,68,68,.15) 15%,transparent 30%);z-index:-1"></div>
    <div class="w-[62px] h-[62px] rounded-full flex items-center justify-center text-[34px] shrink-0 anim-avatar-pulse" style="background:linear-gradient(135deg,#F97316,#EF4444)">🦁</div>
    <div class="flex flex-col">
      <span class="font-display text-base text-slate-300/65 font-medium">Now up</span>
      <span class="font-display text-[36px] font-bold leading-tight">Leo</span>
      <span class="font-cn text-base text-slate-300/65 mt-0.5">现在轮到：Leo</span>
    </div>
  </div>
</footer>

<script>
!function(){var e=new Date,n=("0"+e.getHours()).slice(-2),t=("0"+e.getMinutes()).slice(-2);document.getElementById("clock").textContent=n+":"+t}();
!function(){function e(){var n=window.innerWidth/1920,t=window.innerHeight/1080,i=Math.min(n,t);document.documentElement.style.transformOrigin="top left",document.documentElement.style.transform="scale("+i+")",document.documentElement.style.width=1920*i+"px",document.documentElement.style.height=1080*i+"px"}e(),window.addEventListener("resize",e)}();
</script>
</body>
</html>
