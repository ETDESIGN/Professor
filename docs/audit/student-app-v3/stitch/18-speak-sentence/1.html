<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professor ESL - Speak Sentence (Mic-Ready Recording State)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', 'Noto Sans SC', sans-serif;
      background-color: #E6DCB8;
      background-image: radial-gradient(#C8BC96 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    .font-display {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    .font-cjk {
      font-family: 'Noto Sans SC', 'Nunito', sans-serif;
    }
    /* Tactile 3D button bevels */
    .bevel-terracotta {
      box-shadow: 0 5px 0 #C4553B;
    }
    .bevel-terracotta:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #C4553B;
    }
    .bevel-teal {
      box-shadow: 0 4px 0 #1E6F5C;
    }
    .bevel-teal:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1E6F5C;
    }
    .bevel-blue {
      box-shadow: 0 3px 0 #0088CC;
    }
    .bevel-blue:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0088CC;
    }
    .bevel-card {
      box-shadow: 0 4px 0 #E2D7C3;
    }
    .bevel-chip {
      box-shadow: 0 2px 0 #D7CABB;
    }

    /* Animated audio visualizer bars */
    @keyframes bounceWave1 {
      0%, 100% { height: 16px; opacity: 0.7; }
      50% { height: 32px; opacity: 1; }
    }
    @keyframes bounceWave2 {
      0%, 100% { height: 36px; opacity: 0.85; }
      50% { height: 54px; opacity: 1; }
    }
    @keyframes bounceWave3 {
      0%, 100% { height: 62px; opacity: 1; }
      50% { height: 26px; opacity: 0.9; }
    }
    @keyframes bounceWave4 {
      0%, 100% { height: 32px; opacity: 0.85; }
      50% { height: 48px; opacity: 1; }
    }
    @keyframes bounceWave5 {
      0%, 100% { height: 18px; opacity: 0.7; }
      50% { height: 28px; opacity: 0.95; }
    }

    .eq-bar-1 { animation: bounceWave1 0.75s ease-in-out infinite; }
    .eq-bar-2 { animation: bounceWave2 0.65s ease-in-out infinite 0.15s; }
    .eq-bar-3 { animation: bounceWave3 0.85s ease-in-out infinite 0.05s; }
    .eq-bar-4 { animation: bounceWave4 0.7s ease-in-out infinite 0.2s; }
    .eq-bar-5 { animation: bounceWave5 0.8s ease-in-out infinite 0.1s; }

    /* Amber microphone audio-capture pulsing ring */
    @keyframes micGlowPulse {
      0% {
        box-shadow: 0 5px 0 #C4553B, 0 0 0 0 rgba(244, 162, 97, 0.65), 0 0 0 0 rgba(231, 111, 81, 0.35);
      }
      50% {
        box-shadow: 0 5px 0 #C4553B, 0 0 0 12px rgba(244, 162, 97, 0.4), 0 0 0 24px rgba(231, 111, 81, 0.12);
      }
      100% {
        box-shadow: 0 5px 0 #C4553B, 0 0 0 20px rgba(244, 162, 97, 0), 0 0 0 32px rgba(231, 111, 81, 0);
      }
    }
    .mic-recording-pulse {
      animation: micGlowPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Ambient float for headphone mascot */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
    }
    .mascot-float {
      animation: gentleFloat 2.8s ease-in-out infinite;
    }

    /* Recording dot blink */
    @keyframes recBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .rec-dot {
      animation: recBlink 1.1s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased text-[#264653]">

  <!-- Mobile Screen Container (390px x 844px form factor) -->
  <div class="relative w-[390px] h-[844px] bg-[#EAE0D0] rounded-[44px] shadow-[0_24px_60px_rgba(0,0,0,0.18)] border-[9px] border-[#382F2D] flex flex-col overflow-hidden select-none">

    <!-- Universal 64px Header on Paper #FDFBF7 -->
    <header class="h-16 px-4 bg-[#FDFBF7] border-b border-[#E2D7C3] flex items-center justify-between shrink-0 z-20">
      <!-- 48px Close '✕' Button [playCue: tap_exit] -->
      <button class="w-11 h-11 rounded-2xl bg-[#F7F3E8] border border-[#E2D7C3] text-[#8C7A68] hover:text-[#264653] flex items-center justify-center font-display font-bold text-xl transition-colors bevel-chip active:translate-y-0.5" title="Exit Exercise" aria-label="Close">
        ✕
      </button>

      <!-- Step Progress Bar (Step 8 active in Duolingo pink #E91E63 - 85% progress) -->
      <div class="flex-1 mx-3.5 flex flex-col items-center">
        <div class="flex items-center justify-between w-full mb-1.5 px-0.5 text-[11px] font-extrabold tracking-wide uppercase">
          <span class="text-[#E76F51] font-display flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-[#E76F51]"></span>
            STEP 8 OF 8
          </span>
          <span class="text-[#8C7A68] font-bold">SPEAK SENTENCE</span>
        </div>
        <!-- Segmented bar with Duolingo pink completion -->
        <div class="w-full h-3 bg-[#EAE0D0] rounded-full p-0.5 flex gap-1 overflow-hidden border border-[#DDD0BC]">
          <!-- 7 completed steps (teal) -->
          <div class="flex-[7] h-full bg-[#2A9D8F] rounded-full"></div>
          <!-- Step 8 active (Duolingo pink #E91E63) -->
          <div class="flex-[2] h-full bg-[#E91E63] rounded-full relative overflow-hidden">
            <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
          </div>
        </div>
      </div>

      <!-- Live Hearts Counter ❤️ 4 -->
      <div class="flex items-center gap-1.5 px-2.5 py-1.5 bg-[#FFF0F2] border border-[#FFCCD3] rounded-2xl shadow-xs">
        <span class="text-sm leading-none animate-bounce" style="animation-duration: 2s;">❤️</span>
        <span class="font-display font-bold text-[#FF4B4B] text-sm">4</span>
      </div>
    </header>

    <!-- Main Exercise Scrollable / Fitted Canvas -->
    <main class="flex-1 px-4 pt-3.5 pb-2 flex flex-col justify-between overflow-y-auto">

      <!-- Top Companion Scene & Target Sentence Card -->
      <section class="bg-[#FDFBF7] rounded-[28px] p-4 border border-[#E2D7C3] bevel-card text-center flex flex-col items-center relative">
        
        <!-- Eyebrow Badge: "SPEAK OUT LOUD • 大声朗读" in terracotta #E76F51 -->
        <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-[#FDF2E9] border border-[#F8D2C4] rounded-full text-[11px] font-extrabold text-[#E76F51] tracking-wider uppercase mb-2 shadow-2xs">
          <span class="w-2 h-2 rounded-full bg-[#E76F51] animate-ping opacity-75"></span>
          <span>SPEAK OUT LOUD • 大声朗读</span>
        </div>

        <!-- Mascot Scene: Cute Professor Owl wearing DJ headphones cheering with open wings -->
        <div class="relative w-24 h-20 flex items-center justify-center my-0.5 mascot-float">
          <!-- Ambient Soundwaves behind DJ Owl -->
          <div class="absolute -left-3 top-2 flex flex-col gap-1 items-end opacity-60">
            <span class="w-2 h-1 bg-[#38BDF8] rounded-full"></span>
            <span class="w-3.5 h-1 bg-[#F4A261] rounded-full"></span>
            <span class="w-1.5 h-1 bg-[#38BDF8] rounded-full"></span>
          </div>
          <div class="absolute -right-3 top-2 flex flex-col gap-1 items-start opacity-60">
            <span class="w-3 h-1 bg-[#F4A261] rounded-full"></span>
            <span class="w-2 h-1 bg-[#38BDF8] rounded-full"></span>
            <span class="w-4 h-1 bg-[#F4A261] rounded-full"></span>
          </div>

          <!-- DJ Professor Owl SVG Illustration -->
          <svg class="w-20 h-20 drop-shadow-md" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Left Wing (raised cheering/conducting) -->
            <path d="M22 62C15 54 8 50 2 54C-3 58 2 70 12 76C19 80 26 76 26 70" fill="#2A9D8F" stroke="#1D3557" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M7 58C12 62 18 64 24 64" stroke="#48CAE4" stroke-width="2" stroke-linecap="round"/>
            
            <!-- Right Wing (raised cheering) -->
            <path d="M98 62C105 54 112 50 118 54C123 58 118 70 108 76C101 80 94 76 94 70" fill="#2A9D8F" stroke="#1D3557" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M113 58C108 62 102 64 96 64" stroke="#48CAE4" stroke-width="2" stroke-linecap="round"/>

            <!-- Feet / Perch -->
            <ellipse cx="48" cy="106" rx="7" ry="4" fill="#E76F51"/>
            <ellipse cx="72" cy="106" rx="7" ry="4" fill="#E76F51"/>

            <!-- Owl Body -->
            <path d="M60 22C38 22 26 38 26 68C26 92 40 106 60 106C80 106 94 92 94 68C94 38 82 22 60 22Z" fill="#2A9D8F" stroke="#1D3557" stroke-width="3"/>
            
            <!-- Belly / Chest feathers -->
            <path d="M60 52C46 52 38 64 38 82C38 98 48 103 60 103C72 103 82 98 82 82C82 64 74 52 60 52Z" fill="#FDFBF7"/>
            <path d="M52 68C56 71 64 71 68 68" stroke="#E2D7C3" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M48 78C54 82 66 82 72 78" stroke="#E2D7C3" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M54 88C57 91 63 91 66 88" stroke="#E2D7C3" stroke-width="2.5" stroke-linecap="round"/>

            <!-- Large Scholarly Eyes with White Backing -->
            <circle cx="45" cy="46" r="16" fill="#FDFBF7" stroke="#1D3557" stroke-width="3"/>
            <circle cx="75" cy="46" r="16" fill="#FDFBF7" stroke="#1D3557" stroke-width="3"/>

            <!-- Joyful Happy Arcs (closed cheering eyes) -->
            <path d="M36 46C38 41 43 38 48 39C52 40 54 44 54 46" stroke="#1D3557" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M66 46C68 41 73 38 78 39C82 40 84 44 84 46" stroke="#1D3557" stroke-width="3.5" stroke-linecap="round"/>

            <!-- Cute Blushing Cheeks -->
            <circle cx="34" cy="56" r="4.5" fill="#FF8FA3" opacity="0.8"/>
            <circle cx="86" cy="56" r="4.5" fill="#FF8FA3" opacity="0.8"/>

            <!-- Golden Owl Beak -->
            <path d="M60 49L54 58H66L60 49Z" fill="#E9C46A" stroke="#C99E32" stroke-width="2" stroke-linejoin="round"/>

            <!-- DJ Professor Headphones (Cyan & Amber) -->
            <!-- Headband -->
            <path d="M22 48C22 22 40 12 60 12C80 12 98 22 98 48" stroke="#1D3557" stroke-width="5" stroke-linecap="round"/>
            <path d="M26 44C26 24 42 16 60 16C78 16 94 24 94 44" stroke="#F4A261" stroke-width="3" stroke-linecap="round"/>
            <!-- Left Earcup with Music Note -->
            <rect x="15" y="38" width="12" height="24" rx="6" fill="#38BDF8" stroke="#1D3557" stroke-width="2.5"/>
            <circle cx="21" cy="50" r="3" fill="#FDFBF7"/>
            <!-- Right Earcup -->
            <rect x="93" y="38" width="12" height="24" rx="6" fill="#38BDF8" stroke="#1D3557" stroke-width="2.5"/>
            <circle cx="99" cy="50" r="3" fill="#FDFBF7"/>

            <!-- Professor Graduation Mini Cap tilted -->
            <path d="M44 14L60 8L76 14L60 20L44 14Z" fill="#E76F51" stroke="#C4553B" stroke-width="1.5"/>
            <circle cx="60" cy="14" r="2" fill="#E9C46A"/>
            <path d="M60 14L68 22" stroke="#E9C46A" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- Target Sentence Card (Fredoka 24px inkDeep #1D3557) -->
        <div class="w-full bg-[#F7F3E8] border border-[#E2D7C3] rounded-2xl py-3 px-3.5 my-1.5 bevel-chip">
          <p class="font-display font-semibold text-[23px] leading-tight text-[#1D3557] tracking-normal">
            “The tractor is <span class="text-[#2A9D8F] underline decoration-[#2A9D8F]/40 decoration-wavy underline-offset-4">big</span> and <span class="text-[#2A9D8F] underline decoration-[#2A9D8F]/40 decoration-wavy underline-offset-4">green</span>.”
          </p>
          
          <!-- L1 Support Chip: Chinese subtitle "这辆拖拉机又大又绿。" -->
          <div class="mt-2 inline-flex items-center gap-1.5 px-2.5 py-0.5 bg-[#EAE0D0]/60 rounded-lg text-xs font-semibold text-[#8C7A68]">
            <span class="font-cjk tracking-wide">这辆拖拉机又大又绿。</span>
          </div>
        </div>

        <!-- Hear-First Audio Pill: 44px blue button "🔊 Hear model first" ([playCue: prompt_audio] [TTS: The tractor is big and green.]) -->
        <button class="h-11 px-4 mt-1 bg-[#1CB0F6] hover:bg-[#0EA5E9] text-white rounded-2xl font-display font-semibold text-sm flex items-center justify-center gap-2 bevel-blue transition-transform" title="[playCue: prompt_audio] [TTS: The tractor is big and green.]">
          <span class="text-base leading-none">🔊</span>
          <span>Hear model first</span>
          <span class="text-[11px] font-bold bg-white/20 px-2 py-0.5 rounded-md ml-0.5">示范读音</span>
        </button>
      </section>

      <!-- Live Mic Recording Deck (Audit P1 F2) -->
      <section class="bg-[#FDFBF7] rounded-[32px] p-5 border border-[#E2D7C3] bevel-card flex flex-col items-center justify-center relative my-2">
        
        <!-- Live status bar with Recording Indicator -->
        <div class="flex items-center gap-2 mb-3 px-3 py-1 bg-[#FFF4F0] border border-[#FCD9CF] rounded-full">
          <span class="w-2.5 h-2.5 rounded-full bg-[#FF4B4B] rec-dot"></span>
          <span class="text-xs font-extrabold text-[#E76F51] tracking-wide font-display">
            🎙️ LISTENING... SPEAK CLEARLY
          </span>
          <span class="text-[10px] text-[#8C7A68] font-mono border-l border-[#FCD9CF] pl-2">[mic_active]</span>
        </div>

        <!-- Center 88×88px Circular Mic Button in Terracotta #E76F51 with glowing amber audio-capture ring -->
        <div class="relative my-2 flex items-center justify-center">
          <!-- Glowing audio capture ring ambient effect -->
          <div class="absolute w-[116px] h-[116px] rounded-full bg-[#F4A261]/20 pointer-events-none"></div>

          <!-- Main Interactive 88x88px Mic Button -->
          <button class="relative w-[88px] h-[88px] rounded-full bg-[#E76F51] bevel-terracotta mic-recording-pulse flex items-center justify-center text-white z-10 transition-transform active:scale-95" aria-label="Microphone Recording Active" title="[playCue: mic_start] Speak sentence now">
            <!-- Inner ring border -->
            <div class="absolute inset-1.5 rounded-full border border-white/30 pointer-events-none"></div>
            
            <!-- High-res Mic SVG Icon -->
            <svg class="w-9 h-9 text-white drop-shadow-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor"/>
              <path d="M5 10a7 7 0 0 0 14 0" stroke="white" fill="none"/>
              <line x1="12" y1="17" x2="12" y2="21" stroke="white"/>
              <line x1="8" y1="21" x2="16" y2="21" stroke="white"/>
            </svg>
          </button>
        </div>

        <!-- Live 5-bar Audio Volume Visualizer (jumping dynamic bars: 18px, 42px, 64px, 38px, 20px in sky blue #38BDF8) -->
        <div class="h-16 flex items-end justify-center gap-2.5 my-2 px-6 py-1 bg-[#F7F3E8] rounded-2xl border border-[#E2D7C3]/80 w-full max-w-[240px]">
          <!-- Bar 1 (18px) -->
          <div class="w-3 rounded-full bg-[#38BDF8] eq-bar-1" style="height: 18px;"></div>
          <!-- Bar 2 (42px) -->
          <div class="w-3 rounded-full bg-[#38BDF8] eq-bar-2" style="height: 42px;"></div>
          <!-- Bar 3 (64px peak center) -->
          <div class="w-3.5 rounded-full bg-[#0284C7] eq-bar-3 shadow-xs" style="height: 64px;"></div>
          <!-- Bar 4 (38px) -->
          <div class="w-3 rounded-full bg-[#38BDF8] eq-bar-4" style="height: 38px;"></div>
          <!-- Bar 5 (20px) -->
          <div class="w-3 rounded-full bg-[#38BDF8] eq-bar-5" style="height: 20px;"></div>
        </div>

        <!-- Interim Transcript Chip (Audit F4): "I hear: 'The tractor is...'" in soft muted #8C7A68 -->
        <div class="mt-2.5 px-3.5 py-1.5 bg-[#F7F3E8] border border-[#E2D7C3] rounded-xl flex items-center gap-2 max-w-full">
          <span class="text-xs font-extrabold text-[#2A9D8F] font-display uppercase tracking-wider">I Hear:</span>
          <p class="text-sm font-semibold text-[#1D3557] truncate font-display">
            “The tractor is<span class="inline-block w-1.5 h-3.5 bg-[#E76F51] ml-1 rounded-xs animate-pulse"></span>”
          </p>
        </div>

        <!-- Real-time Instruction Prompt -->
        <p class="text-[12px] font-bold text-[#8C7A68] mt-2 flex items-center gap-1">
          <span>Keep speaking... finish the sentence!</span>
        </p>
      </section>

      <!-- Anchored Footer & Pedagogical Safety Bar -->
      <footer class="pt-1 pb-2 shrink-0">
        <!-- Attempt Counter Card -->
        <div class="w-full bg-[#FDFBF7] border border-[#E2D7C3] rounded-2xl px-3.5 py-2.5 bevel-chip flex items-center justify-between">
          <div class="flex items-center gap-2">
            <!-- Badge 1 of 3 -->
            <span class="px-2.5 py-1 bg-[#EAE0D0] text-[#264653] font-display font-bold text-xs rounded-lg">
              Attempt 1 of 3
            </span>
            <!-- Pedagogical reassuring copy -->
            <div class="text-left">
              <p class="text-[11px] font-extrabold text-[#264653] leading-tight">
                Practice speaking without fear!
              </p>
              <p class="text-[10px] font-semibold text-[#2A9D8F] flex items-center gap-1 mt-0.5">
                <span>🛡️ Speaking errors never cost hearts</span>
              </p>
            </div>
          </div>

          <!-- Quick Finish / Stop & Check Button -->
          <button class="h-9 px-3 bg-[#2A9D8F] hover:bg-[#238276] text-white rounded-xl font-display font-bold text-xs flex items-center gap-1 bevel-teal active:translate-y-0.5" title="Done Speaking, evaluate audio">
            <span>Done</span>
            <span>✓</span>
          </button>
        </div>
      </footer>

    </main>

  </div>

</body>
</html>
