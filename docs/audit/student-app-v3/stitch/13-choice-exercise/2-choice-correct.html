<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChoiceExercise - Correct Feedback State</title>
  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#EAE0D0',
            paper: '#FDFBF7',
            mist: '#F7F3E8',
            borderCream: '#E2D7C3',
            ink: '#264653',
            inkDeep: '#1D3557',
            mutedInk: '#8C7A68',
            tealAccent: '#2A9D8F',
            tealBevel: '#1E6F5C',
            tealLight: '#E6F4F1',
            drawerBg: '#E8F8F5',
            duoBlue: '#1CB0F6',
            duoPink: '#E91E63',
            heartRed: '#FF4B4B',
          },
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #EAE0D0;
      color: #264653;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-bevel-teal {
      box-shadow: 0 4px 0 #1E6F5C;
    }
    .btn-bevel-teal:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1E6F5C;
    }
    .card-bevel-normal {
      box-shadow: 0 4px 0 #E2D7C3;
    }
    .card-bevel-selected {
      box-shadow: 0 4px 0 #1E6F5C;
    }
    .btn-audio-bevel {
      box-shadow: 0 4px 0 #1899D6;
    }
    .btn-audio-bevel:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1899D6;
    }
    /* Bounce entrance for drawer & check icon */
    @keyframes slideUpDrawer {
      0% { transform: translateY(40px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-drawer {
      animation: slideUpDrawer 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-pop {
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 bg-[#D8CEBD]">
  <!-- Mobile Container (390 x 844) -->
  <main class="w-[390px] h-[844px] bg-[#EAE0D0] relative flex flex-col justify-between overflow-hidden shadow-2xl rounded-[36px] border-[6px] border-[#D4C7B4]">
    
    <!-- Top Scrollable / Content Area -->
    <div class="flex-1 flex flex-col px-5 pt-4 overflow-y-auto pb-48">
      
      <!-- 1. TOP APP HEADER / HUD -->
      <header class="flex items-center justify-between gap-3 mb-4">
        <!-- Close Button 'X' (48x48px tap target) -->
        <button class="w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-[#DFD3C1] active:scale-95 transition-all text-[#8C7A68]" aria-label="Close">
          <svg class="w-6 h-6 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>

        <!-- Center Progress Bar -->
        <div class="flex-1 h-3.5 bg-[#E2D7C3] rounded-full overflow-hidden p-[2px] shadow-inner">
          <div class="h-full bg-[#E91E63] rounded-full w-1/2 relative">
            <!-- Gloss highlight pill inside bar -->
            <div class="absolute top-[2px] left-1 right-2 h-[2px] bg-white/40 rounded-full"></div>
          </div>
        </div>

        <!-- Right: Live Hearts Counter -->
        <div class="flex items-center gap-1.5 pl-1 pr-2 py-1 bg-[#FDFBF7]/60 rounded-xl border border-[#E2D7C3]/80">
          <svg class="w-5 h-5 fill-[#FF4B4B] drop-shadow-sm" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span class="font-fredoka font-bold text-lg leading-none text-[#264653]">4</span>
        </div>
      </header>

      <!-- Context Subtitle Chip -->
      <div class="flex justify-center mb-3">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#F7F3E8] border border-[#E2D7C3] text-[11px] font-extrabold tracking-widest text-[#8C7A68] uppercase font-nunito shadow-2xs">
          <span class="w-1.5 h-1.5 rounded-full bg-[#2A9D8F]"></span>
          GRAMMAR LAB • PREPOSITIONS
        </span>
      </div>

      <!-- Challenge Prompt Area -->
      <section class="bg-[#FDFBF7] rounded-2xl border-2 border-[#E2D7C3] p-4 shadow-sm mb-4">
        <div class="flex items-center gap-3.5">
          <!-- Audio speaker button (48x48px) -->
          <button class="w-12 h-12 shrink-0 bg-[#1CB0F6] rounded-xl text-white flex items-center justify-center btn-audio-bevel active:scale-95 transition-all" aria-label="Play Challenge Audio">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
          <!-- Challenge sentence -->
          <div class="text-[17px] font-nunito font-bold text-[#1D3557] leading-relaxed">
            The clever fox jumped 
            <span class="inline-flex items-center px-2.5 py-0.5 mx-1 rounded-lg bg-[#E6F4F1] border-2 border-[#2A9D8F] font-extrabold text-[#2A9D8F]">
              over
            </span> 
            the fence.
          </div>
        </div>
      </section>

      <!-- 2. MULTIPLE CHOICE STACKED OPTIONS (CORRECT STATE) -->
      <section class="flex flex-col gap-3" aria-label="Answer Options">
        
        <!-- Option A: across (muted/dimmed) -->
        <button class="w-full bg-[#FDFBF7] border-2 border-[#E2D7C3] card-bevel-normal rounded-2xl p-3.5 flex items-center justify-between text-left opacity-50 cursor-not-allowed">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-xl bg-[#EAE0D0]/70 flex items-center justify-center font-fredoka font-bold text-xs text-[#8C7A68]">A</span>
            <span class="font-fredoka font-bold text-lg text-[#264653]">across</span>
          </div>
        </button>

        <!-- Option B (SELECTED & CORRECT): over -->
        <button class="w-full bg-[#E6F4F1] border-2 border-[#2A9D8F] card-bevel-selected rounded-2xl p-3.5 flex items-center justify-between text-left cursor-default ring-1 ring-[#2A9D8F]/30">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-xl bg-[#2A9D8F] flex items-center justify-center font-fredoka font-bold text-xs text-white">B</span>
            <span class="font-fredoka font-bold text-xl text-[#1D3557]">over</span>
          </div>
          <!-- Emerald Checkmark Badge (28x28px) -->
          <div class="w-7 h-7 bg-[#2A9D8F] text-white rounded-full flex items-center justify-center shadow-sm animate-pop">
            <svg class="w-4 h-4 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
        </button>

        <!-- Option C: under (muted/dimmed) -->
        <button class="w-full bg-[#FDFBF7] border-2 border-[#E2D7C3] card-bevel-normal rounded-2xl p-3.5 flex items-center justify-between text-left opacity-50 cursor-not-allowed">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-xl bg-[#EAE0D0]/70 flex items-center justify-center font-fredoka font-bold text-xs text-[#8C7A68]">C</span>
            <span class="font-fredoka font-bold text-lg text-[#264653]">under</span>
          </div>
        </button>

        <!-- Option D: through (muted/dimmed) -->
        <button class="w-full bg-[#FDFBF7] border-2 border-[#E2D7C3] card-bevel-normal rounded-2xl p-3.5 flex items-center justify-between text-left opacity-50 cursor-not-allowed">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-xl bg-[#EAE0D0]/70 flex items-center justify-center font-fredoka font-bold text-xs text-[#8C7A68]">D</span>
            <span class="font-fredoka font-bold text-lg text-[#264653]">through</span>
          </div>
        </button>
      </section>

    </div>

    <!-- 3. ANCHORED BOTTOM FEEDBACK DRAWER (DUOLINGO STYLE CORRECT STATE) -->
    <footer class="absolute bottom-0 inset-x-0 bg-[#E8F8F5] border-t-2 border-[#2A9D8F] rounded-t-3xl p-5 shadow-2xl animate-drawer z-30">
      
      <!-- Feedback Header Row -->
      <div class="flex items-center gap-3 mb-2">
        <!-- 40x40px Emerald Circle Icon -->
        <div class="w-10 h-10 rounded-full bg-[#2A9D8F] text-white flex items-center justify-center shadow-sm shrink-0">
          <svg class="w-5 h-5 stroke-[3.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <div>
          <h2 class="font-fredoka font-bold text-[20px] text-[#1D3557] leading-tight">
            Nicely done! <span class="text-[#2A9D8F] font-extrabold">+1 XP</span>
          </h2>
        </div>
      </div>

      <!-- Pedagogical Explanation -->
      <div class="mb-4 pl-1">
        <p class="font-nunito font-bold text-sm text-[#1D3557] leading-snug">
          We use "over" when moving across and above an obstacle.
        </p>
        <p class="font-nunito font-semibold text-[13px] text-[#264653]/80 mt-0.5">
          跨越障碍物上方时使用 over
        </p>
      </div>

      <!-- Child Action CTA Button -->
      <button class="w-full h-[54px] bg-[#2A9D8F] btn-bevel-teal rounded-2xl text-white font-fredoka font-bold text-lg tracking-wider flex items-center justify-center gap-2 transition-transform cursor-pointer">
        <span>CONTINUE</span>
        <svg class="w-5 h-5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

    </footer>

  </main>
</body>
</html>
